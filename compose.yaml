# palimpsest — media stack
#
# Built against contract.md v4 (2026-08-04). Every UID, GID, path and port
# below is a contract value; none of them may be changed here. If one looks
# wrong, fix it in the contract (and in palimpsest-system), not in this file.
#
# EXPOSURE — contract §5.2. Docker publishes by DNAT in PREROUTING; the
# destination is rewritten before the packet reaches INPUT, so a host-firewall
# rule naming a Docker-published port is never consulted. For anything Docker
# publishes, the bind address is the ONLY enforcement. Hence:
#
#   No published port ever binds 0.0.0.0. All seven bind ${BIND_ADDR_LAN},
#   which has no default — an unset value aborts bring-up rather than starting
#   a stack that listens on every interface.
#
# There is no VPN in this design (v4 removed Tailscale: the family member this
# server exists for watches on a Roku, which has no VPN client). Everything is
# LAN-only, admin UIs included, bounded by bind address rather than firewall.
#
# Remote access is contract §5.3 and is NOT built here: 443/tcp forwarded to a
# host-side TLS reverse proxy in palimpsest-system. This file's obligation
# under §5.3 is a negative one — Jellyfin stays host-networked and must never
# be Docker-published. See the jellyfin block.
#
# Deployed at /opt/palimpsest-stack/compose.yaml as a plain file — deliberately
# NOT in the Nix store, so tweaking the stack does not require a nixos-rebuild.
#
# Image tags are pinned to the current stable release of each project as of
# 2026-08-03. Nothing tracks :latest, and nothing tracks a project's
# nightly/develop/unstable branch. Update deliberately; see NOTES.md.

# ---------------------------------------------------------------------------
# Shared fragments
# ---------------------------------------------------------------------------

# contract §1 — identity. Applies to the LinuxServer.io images, which read
# PUID/PGID/UMASK in their s6 init and drop privileges themselves. Do NOT add
# `user:` to an lscr.io container; it breaks that init.
x-lsio-env: &lsio-env
  PUID: "1500"       # contract §1 — service account `media`
  PGID: "1500"       # contract §1 — service group `media`
  UMASK: "002"       # contract §1 — keeps imports group-writable
  TZ: "America/New_York"

x-common: &common
  restart: unless-stopped   # contract §3 — per-container restart is the whole
                            # recovery story; the systemd unit does not restart.
  networks: [palimpsest]

services:

  # -------------------------------------------------------------------------
  # Jellyfin — the only service on host networking (contract §5.1), because DLNA
  # and client auto-discovery need broadcast traffic on the LAN.
  #
  # Because it is host-networked it is not published by Docker at all, so §5.2's
  # bind-address rule does not apply to it and cannot protect it — the host
  # firewall is its only layer. Discovery is UDP 1900 (SSDP) and UDP 7359
  # (Jellyfin's own broadcast), LAN only; both are opened in palimpsest-system,
  # not here. Without them auto-discovery silently fails and every client has to
  # be pointed at an IP by hand.
  #
  # DO NOT ADD A `ports:` BLOCK HERE. Contract §5.3 makes that a hard rule, not
  # a preference: 8096 is plaintext HTTP with no rate limiting and no MFA, and
  # remote access is meant to arrive through the host-side TLS reverse proxy on
  # 443 instead. Docker-publishing 8096 would bypass the host firewall entirely
  # (§5.2) and put it one router forward away from the open internet, in the
  # clear. If Jellyfin ever needs a mapped port, that is a contract amendment.
  #
  # The official jellyfin image is NOT a LinuxServer image: it ignores
  # PUID/PGID/UMASK entirely and runs as whatever `user:` says. Contract §1's
  # values are therefore applied via `user:` + `group_add`, which is the same
  # identity by a different mechanism.
  # -------------------------------------------------------------------------
  jellyfin:
    image: jellyfin/jellyfin:10.11.11   # stable. NOT 12.0-rc*, which is a
                                        # release candidate as of 2026-08-03.
    container_name: jellyfin
    network_mode: host                  # contract §5.1 — 8096/tcp, no mapping
    user: "1500:1500"                   # contract §1
    group_add:
      - "303"                           # contract §1 — render GID, pinned by
                                        # NixOS. Required for /dev/dri access.
    devices:
      - /dev/dri:/dev/dri               # contract §4 — passed to Jellyfin only
    environment:
      TZ: "America/New_York"
    volumes:
      - /opt/palimpsest-stack/jellyfin/config:/config
      - /opt/palimpsest-stack/jellyfin/cache:/cache
      - /data:/data                     # contract §2 — identical path in/out
      - /data/transcode:/transcode      # contract §4 — tmpfs, 8 GB
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Automation
  # -------------------------------------------------------------------------

  # Indexer manager. Configure FIRST; it syncs indexers into Sonarr and Radarr.
  # No /data mount — Prowlarr never touches media files.
  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    environment: *lsio-env
    volumes:
      - /opt/palimpsest-stack/prowlarr:/config
    ports:
      - "${BIND_ADDR_LAN:?no default — set to this machine's LAN address in .env, contract §5.2}:9696:9696"   # contract §5.1

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: sonarr
    environment: *lsio-env
    volumes:
      - /opt/palimpsest-stack/sonarr:/config
      - /data:/data                     # contract §2 — one mount, one path.
                                        # This is what makes hardlinking work.
    ports:
      - "${BIND_ADDR_LAN:?no default — set to this machine's LAN address in .env, contract §5.2}:8989:8989"   # contract §5.1

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:6.3.0
    container_name: radarr
    environment: *lsio-env
    volumes:
      - /opt/palimpsest-stack/radarr:/config
      - /data:/data
    ports:
      - "${BIND_ADDR_LAN:?no default — set to this machine's LAN address in .env, contract §5.2}:7878:7878"   # contract §5.1

  # Subtitles. Reads media in place and writes sidecar files next to it, so it
  # needs the same /data mapping as Sonarr/Radarr.
  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: bazarr
    environment: *lsio-env
    volumes:
      - /opt/palimpsest-stack/bazarr:/config
      - /data:/data
    ports:
      - "${BIND_ADDR_LAN:?no default — set to this machine's LAN address in .env, contract §5.2}:6767:6767"   # contract §5.1

  # Family-facing request UI. Configure LAST — it connects to everything else.
  #
  # Runs as node:node in its own image and has no PUID/PGID support, so
  # contract §1's identity is applied with `user:`. No /data mount: Jellyseerr
  # only talks to other services' APIs, it never touches files.
  #
  # extra_hosts: Jellyfin is on host networking, so it is NOT reachable at
  # `http://jellyfin:8096` from this bridge network. Point Jellyseerr at
  # http://host.docker.internal:8096 instead.
  #
  # Published once on the LAN address like everything else (contract §5.2).
  # Under v3 this service had two mappings because it was reachable from the
  # tailnet as well; v4 removed Tailscale, so the second mapping went with it.
  #
  # It is NOT published on 0.0.0.0 with a firewall rule narrowing it. That does
  # not work and is the defect §5.2 exists to prevent: Docker DNATs in
  # PREROUTING, so the packet never reaches INPUT and the firewall rule is never
  # consulted. For anything Docker publishes, the bind address is the only
  # enforcement there is.
  jellyseerr:
    <<: *common
    image: ghcr.io/fallenbagel/jellyseerr:2.7.3
    container_name: jellyseerr
    user: "1500:1500"                   # contract §1
    environment:
      TZ: "America/New_York"
      LOG_LEVEL: "info"
    volumes:
      - /opt/palimpsest-stack/jellyseerr:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # BIND_ADDR_LAN has no default and MUST be set — contract §5.2. The `:?`
      # form is what enforces that: with the variable unset, compose aborts with
      # exit 15 and names it. Loud, immediate, at bring-up, as intended.
      #
      # Do not replace it with a bare ${BIND_ADDR_LAN} on the assumption that an
      # empty substitution is itself rejected — verify that before relying on
      # it. `:?` is the construct that is documented to abort. See NOTES.md.
      - "${BIND_ADDR_LAN:?no default — set to this machine's LAN address in .env, contract §5.2}:5055:5055"   # contract §5.1

  # -------------------------------------------------------------------------
  # Download clients
  # -------------------------------------------------------------------------

  # Usenet. Direct to the internet, no VPN — the connection to the provider is
  # already TLS and the account is paid and in your name. Nothing to hide from
  # your ISP that a VPN would help with.
  #
  # SABnzbd listens on 8080 inside the container; contract §5.1 puts it on 8081
  # on the host, hence the asymmetric mapping. If you change the port inside
  # SABnzbd's own settings, this mapping silently stops working.
  sabnzbd:
    <<: *common
    image: lscr.io/linuxserver/sabnzbd:5.0.4
    container_name: sabnzbd
    environment: *lsio-env
    volumes:
      - /opt/palimpsest-stack/sabnzbd:/config
      - /data:/data
    ports:
      - "${BIND_ADDR_LAN:?no default — set to this machine's LAN address in .env, contract §5.2}:8081:8080"   # contract §5.1

  # VPN + killswitch, for the torrent client only. gluetun's firewall drops all
  # traffic that is not going over the tunnel, so if the VPN dies qBittorrent
  # loses its network rather than falling back to the bare WAN link.
  #
  # Runs as root: it needs NET_ADMIN to build the tunnel and the firewall.
  gluetun:
    <<: *common
    profiles: ["torrents"]   # INACTIVE BY DEFAULT — see the note above qbittorrent
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # Filled from .env — see .env.example. No credential appears in this
      # file, ever (contract §6).
      VPN_SERVICE_PROVIDER: "${VPN_SERVICE_PROVIDER:-}"
      VPN_TYPE: "${VPN_TYPE:-wireguard}"
      WIREGUARD_PRIVATE_KEY: "${WIREGUARD_PRIVATE_KEY:-}"
      WIREGUARD_ADDRESSES: "${WIREGUARD_ADDRESSES:-}"
      WIREGUARD_PRESHARED_KEY: "${WIREGUARD_PRESHARED_KEY:-}"
      OPENVPN_USER: "${OPENVPN_USER:-}"
      OPENVPN_PASSWORD: "${OPENVPN_PASSWORD:-}"
      SERVER_COUNTRIES: "${SERVER_COUNTRIES:-}"
      # Without this, gluetun's killswitch also drops the replies to the
      # published WebUI port and to Sonarr/Radarr's API calls, and qBittorrent
      # looks dead from every direction. Must match the network subnet below.
      FIREWALL_OUTBOUND_SUBNETS: "${DOCKER_SUBNET:-172.28.0.0/16}"
      TZ: "America/New_York"
    ports:
      # qBittorrent has no network namespace of its own, so its WebUI is
      # published here on gluetun. contract §5.1 — 8080/tcp.
      - "${BIND_ADDR_LAN:?no default — set to this machine's LAN address in .env, contract §5.2}:8080:8080"

  # ---------------------------------------------------------------------------
  # TORRENT PATH — DEFINED BUT NOT RUNNING.
  #
  # This deployment is usenet-only. gluetun and qbittorrent both carry
  # `profiles: ["torrents"]`, so a plain `docker compose up -d` ignores them
  # entirely: 7 services start, not 9, and port 8080 is not listening.
  #
  # To turn the torrent path on:
  #   1. Fill the VPN block in .env (it is blank and unused until then).
  #   2. Add `COMPOSE_PROFILES=torrents` to .env.
  #   3. Restart the stack. No change to palimpsest-system is needed — that is
  #      the whole reason this is a profile rather than a second compose file:
  #      the systemd unit's plain `docker compose up -d` picks up the profile
  #      from .env, so enabling torrents never crosses the repo boundary.
  #
  # BEFORE ENABLING, RE-PIN BOTH IMAGE TAGS. They were resolved 2026-08-03 and
  # are not exercised while the profile is off, so they rot silently. gluetun in
  # particular has renamed provider environment variables across versions — do
  # not assume the VPN block below still matches whatever :latest has become.
  # Resolve what each registry's `latest` actually points at, as NOTES.md
  # describes, then update the tags deliberately.
  # ---------------------------------------------------------------------------

  # Torrents, inside gluetun's network namespace. No `ports:` and no
  # `networks:` — it has neither; see gluetun above for both.
  qbittorrent:
    profiles: ["torrents"]   # INACTIVE BY DEFAULT — see the note above
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    container_name: qbittorrent
    environment:
      <<: *lsio-env
      WEBUI_PORT: "8080"
    volumes:
      - /opt/palimpsest-stack/qbittorrent:/config
      - /data:/data
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy   # do not start until the tunnel is up, so
                                     # the client never sees a bare WAN route
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Networking
#
# The subnet is pinned rather than left to Docker's allocator because gluetun's
# FIREWALL_OUTBOUND_SUBNETS above has to name it explicitly. If you change one,
# change both — or set DOCKER_SUBNET in .env, which feeds both.
# ---------------------------------------------------------------------------
networks:
  palimpsest:
    name: palimpsest
    driver: bridge
    ipam:
      config:
        - subnet: "${DOCKER_SUBNET:-172.28.0.0/16}"
